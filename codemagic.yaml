workflows:
  android-build:
    name: Android APK + AAB Build
    max_build_duration: 60
    instance_type: linux

    environment:
      flutter: stable
      android_signing:
        - studetra-upload-key

    scripts:
      - flutter clean
      - flutter pub get
      - flutter build appbundle --release

    artifacts:
      - build/app/outputs/bundle/release/*.aab
