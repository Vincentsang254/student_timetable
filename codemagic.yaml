workflows:
  android-build:
    name: Android APK + AAB Build
    max_build_duration: 60
    instance_type: linux
    environment:
      flutter: stable
    scripts:
      - name: Clean project
        script: flutter clean
      - name: Get dependencies
        script: flutter pub get
      - name: Create Android signing config
        script: |
          if [ -z "$CM_KEYSTORE_BASE64" ] || [ -z "$CM_KEYSTORE_PASSWORD" ] || [ -z "$CM_KEY_ALIAS" ] || [ -z "$CM_KEY_PASSWORD" ]; then
            echo "Missing Codemagic signing environment variables."
            echo "Set CM_KEYSTORE_BASE64, CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, and CM_KEY_PASSWORD in Codemagic." 
            exit 1
          fi

          mkdir -p android/app
          echo "$CM_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=app/upload-keystore.jks
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF
      - name: Run tests (optional)
        script: flutter test
        ignore_failure: true
      - name: Build APK (release)
        script: flutter build apk --release
      - name: Build AAB (release)
        script: flutter build appbundle --release
      - name: Debug APK output
        script: ls -R build/app/outputs/flutter-apk/
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab
